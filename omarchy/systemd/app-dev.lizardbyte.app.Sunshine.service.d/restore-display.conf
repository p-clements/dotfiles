# Install as ~/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/restore-display.conf
# Whenever Sunshine (re)starts, no app is running yet, so the physical layout is the correct one.
# Covers Sunshine crashing mid-stream (no undo command runs on a crash) and the watchdog's restart.
# Leading "-" = never block Sunshine from starting if this fails. Runs after the unit's own "sleep 5".
[Service]
ExecStartPre=-%h/.config/sunshine/virtual-display.sh off
